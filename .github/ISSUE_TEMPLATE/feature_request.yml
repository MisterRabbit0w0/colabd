name: Feature request
description: Propose a new backend, tunnel provider, or storage adapter
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the workflow limitation or hardware constraint you hit on Google Colab.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the CLI flag, menu setting, or runtime behavior you want.
    validations:
      required: true
