name: Bug report
description: Report a reproducible failure in colabd or its remote Colab supervisor
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: State the exact command, menu option, and error message.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Host OS and Colab GPU runtime
      placeholder: "macOS 15.2, Bash 3.2, google-colab-cli 0.7.0, G4 96GB High-RAM"
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage mode
      options:
        - auto
        - nvme_engram
        - drive_engram
        - drive_full
        - local_nvme
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
      description: Paste sanitized lines from menu option 3. Remove API keys and tokens first.
